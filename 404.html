<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VaporNova — Page introuvable</title>
  <script>
    // GitHub Pages 404 redirect — preserve path under /vapornova/
    var base = '/vapornova/';
    var path = window.location.pathname.replace(/^\/vapornova/, '') || '/';
    var search = window.location.search;
    var hash = window.location.hash;
    // If the path is a known page, redirect directly
    var pages = { '/boutique': 'boutique.html', '/blog': 'blog.html', '/contact': 'contact.html', '/affiliation': 'affiliation.html' };
    var clean = path.replace(/\/$/, '');
    if (pages[clean]) {
      window.location.replace(base + pages[clean]);
    } else {
      window.location.replace(base + 'index.html');
    }
  </script>
</head>
<body></body>
</html>
